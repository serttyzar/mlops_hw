apiVersion: v1
kind: ServiceAccount
metadata:
  name: hw11-monitor
---
# Source: hw11/templates/api.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hw11-api
  labels:
    app: hw11-api
    release: hw11
data:
  HW11_FAULTS_ENABLED: "false"
  HW11_VERSION: "A"
  HW11_WARMUP: "20"
  HW11_BROKEN_PROBES: "false"
  HW11_CONCURRENCY: "1"
  HW11_QUEUE_CAPACITY: "24"
  HW11_QUEUE_TIMEOUT: "12"
  HW11_CACHE_SIZE: "16"
  HW11_HIT_CPU: "0.025"
  HW11_MISS_CPU: "0.2"
  HW11_CHUNK_CPU: "0.008"
  HW11_CHUNK_INTERVAL: "0.02"
---
# Source: hw11/templates/monitoring.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hw11-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: api
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: hw11
          - source_labels: [__meta_kubernetes_pod_label_release]
            action: keep
            regex: hw11
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: hw11-api
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      - job_name: state-metrics
        static_configs:
          - targets: ['hw11-state-metrics:8080']
      - job_name: cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [namespace]
            action: keep
            regex: hw11
    
  alerts.yml: |
    groups:
      - name: hw11
        rules:
          - alert: HighTTFC
            expr: (histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[1m]))) > 0.8) and (sum(increase(hw11_ttfc_seconds_count[1m])) >= 30)
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: Successful response p95 TTFC exceeds 0.8 seconds
          - alert: HighFailureRatio
            expr: (sum(rate(hw11_requests_total{outcome=~"rejected|aborted"}[1m])) / clamp_min(sum(rate(hw11_requests_total[1m])), 0.001) > 0.05) and (sum(increase(hw11_requests_total[1m])) >= 30)
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: Rejected or aborted fraction exceeds 5 percent
