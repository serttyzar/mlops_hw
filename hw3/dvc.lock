            write a short verdict, then list the pros and the cons. Use only 
            what the reviews actually say.
          - 'Given a set of customer reviews for one product, produce a compact summary:
            a one-sentence verdict, a list of pros and a list of cons. Do not invent
            details that are absent from the reviews.'
          - Your task is opinion summarisation. From the reviews below, write a 
            verdict sentence, then bullet the advantages and the drawbacks that 
            reviewers mention. Stay grounded in the reviews.
          - 'Read the product reviews and condense them: one verdict line, then Pros
            and Cons as bullet lists. Every bullet must be supported by at least one
            review.'
          - You are a review digest assistant. Summarise the customer reviews of
            the product into a verdict, a Pros list and a Cons list. No 
            speculation, no marketing language.
