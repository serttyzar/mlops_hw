metadata:
  name: hw11-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hw11-grafana
  template:
    metadata:
      labels:
        app: hw11-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
