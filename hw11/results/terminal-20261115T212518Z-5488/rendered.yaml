          memory: 192Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: results
          mountPath: /tmp
  volumes:
    - name: results
      emptyDir:
        sizeLimit: 128Mi
