# Source: hw11/templates/monitoring.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw11-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hw11-prometheus
  template:
    metadata:
      labels:
        app: hw11-prometheus
    spec:
      serviceAccountName: hw11-monitor
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=2h", "--storage.tsdb.retention.size=256MB"]
          ports:
            - containerPort: 9090
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: hw11-prometheus
        - name: data
          emptyDir: {sizeLimit: 512Mi}
---
