# Единственная точка конфигурации ДЗ 3.
# Ни один путь, порог или размер среза не должен появляться в коде строкой.

collect:
  # Источник — AmaSum (EMNLP 2021, «Learning Opinion Summarizers by Selecting
  # Informative Reviews»): отзывы покупателей Amazon плюс НАПИСАННОЕ ЧЕЛОВЕКОМ
  # резюме товара из verdict / pros / cons. Сырьё выкладывается на диск
  # скриптом scripts/fetch_source.py — он же режет его на шарды.
  # Задача датасета: набор отзывов на товар → резюме с плюсами и минусами.

  # Версия датасета переключается ЗДЕСЬ. Всё остальное — следствие.
  version: "v2"              # v1 | v2
  n_rows: 2000               # строк, берём из каждого файла-источника ПОСЛЕ фильтров
  sources:
    v1:
      - "../../datasets/amasum/shards/0000.parquet"
    v2:
      - "../../datasets/amasum/shards/0000.parquet"
      - "../../datasets/amasum/shards/0001.parquet"

  # --- Переработка источника ---
  # Чужой готовый набор — это сырьё, а не сдача (см. README, «Готовый датасет
  # как источник»). Параметры ниже — то, чем эталон отличается от «скачал
  # parquet и переименовал в raw.jsonl». Каждый из них обязан быть отражён
  # в docs/datasheet.md.

  topics: null               # null — все темы источника;
                             # список тем — сузить набор до своей предметной области.
                             # Сужение — законная переработка, но следите за
                             # diversity.min_groups: одна тема не датасет.

  # Отбор отзывов. В источнике их 10–100 на товар — это десятки тысяч символов,
  # мимо clean.max_user_chars. Берём самые полезные по голосам «helpful», но
  # резервируем места под критические отзывы: без них минусы в ответе не на чем
  # обосновать, и модель учится придумывать их из воздуха.
  reviews_per_example: 8
  min_critical_reviews: 2    # сколько слотов отдать отзывам с рейтингом ≤ critical_rating
  critical_rating: 3.0
  max_review_chars: 400      # обрезка по границе слова

  # Сверка чужой разметки. Резюме писали редакторы обзорных сайтов, глядя на
  # товар, а не на этот набор отзывов: часть пунктов ничем в отзывах
  # не подтверждается, часть — обрывки фраз, разрезанных по запятой.
  # Непроверенная разметка — это чужие ошибки, перенесённые в обучение.
  min_item_words: 3          # пункт короче — обрывок, а не тезис
  min_summary_items: 3       # pros + cons суммарно
  # Пункт считается обоснованным, если выполнен ЛЮБОЙ из двух порогов.
  # Одной долей мерить нельзя: у пунктов 3–5 значимых слов, доля квантуется
  # и меряет длину пункта. Замеры и примеры — в docs/datasheet.md.
  min_item_hits: 2           # значимых слов пункта, найденных в отзывах
  min_item_overlap: 0.5      # их доля — для пунктов в одно-два слова
  min_grounded_share: 0.5    # доля обоснованных пунктов в резюме

  # Кап на долю группы. В источнике «Home & Kitchen > Kitchen & Dining» — это
  # 7.5% товаров, и без капа одна полка магазина решает за весь датасет.
  # Порог diversity.max_group_share при этом не трогается: чиним данные,
  # а не проверку.
  max_group_share: 0.06

  system_prompts:            # В источнике инструкции нет вообще, а у обзорных
                             # сайтов формат резюме один на всех. Модель,
                             # обученная на одной формулировке инструкции,
                             # заучивает её как константу и ломается от перефраза.
                             # Поэтому инструкция разведена на варианты; вариант
                             # выбирается детерминированно по id примера.
    - "You summarise customer reviews of a product. Read the reviews and write a short verdict, then list the pros and the cons. Use only what the reviews actually say."
    - "Given a set of customer reviews for one product, produce a compact summary: a one-sentence verdict, a list of pros and a list of cons. Do not invent details that are absent from the reviews."
    - "Your task is opinion summarisation. From the reviews below, write a verdict sentence, then bullet the advantages and the drawbacks that reviewers mention. Stay grounded in the reviews."
    - "Read the product reviews and condense them: one verdict line, then Pros and Cons as bullet lists. Every bullet must be supported by at least one review."
    - "You are a review digest assistant. Summarise the customer reviews of the product into a verdict, a Pros list and a Cons list. No speculation, no marketing language."

clean:
  # Фильтр длин: слишком короткий пример — обрезок, слишком длинный — выброс.
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4         # длина словного шингла
    num_perm: 64             # перестановок MinHash: точность против скорости
    threshold: 0.85          # Жаккар выше порога — почти-дубль
  pii:
    enabled: true            # стадия обязательна, даже если счётчик нулевой

diversity:
  # Пороги, которым обязан удовлетворять ОЧИЩЕННЫЙ датасет. Стадия diversity
  # падает, если нарушен хоть один: набор из 30 однотипных строк проходит
  # и схему, и дедупликацию, и сплит — формально он безупречен и бесполезен.
  # Разбор такого случая: один системный промпт на все строки, ответы длиной
  # 356–440 символов, сквозные слова во всех ответах. Лосс на нём падает,
  # а модель выучивает шаблон вместо задачи.
  #
  # Пороги — не догма: их можно менять под свою задачу, но только в эту сторону
  # и только с обоснованием в docs/datasheet.md. «Снизил, чтобы позеленело» —
  # не обоснование.

  min_examples: 1000         # строк после очистки. Меньше — модель увидит
                             # каждый пример по нескольку раз за эпоху.
  min_system_prompts: 3      # различных системных промптов
  min_groups: 50             # различных групп (split.group_key)
  max_group_share: 0.10      # доля крупнейшей группы: одна тема не должна
                             # решать за весь датасет
  min_answer_len_ratio: 1.6  # p90/p10 длин ответа ассистента. Ответы одной
                             # длины — верный признак сгенерированного шаблона.
                             # Если у вашей задачи ответы законно однотипные
                             # (метки классов, да/нет) — снижайте порог и
                             # покажите разнообразие на другой оси в datasheet.
  max_same_length_share: 0.25   # доля примеров с самой частой длиной ответа
  max_duplicate_answer_share: 0.30  # доля ответов-повторов (точные совпадения)

split:
  # Группа сплита. Вопросы одной темы не должны разъезжаться по train/test:
  # текст темы дословно входит в промпт, а вопросы внутри темы — парафразы.
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  # Порог поиска near-dup пересечений train/test.
  # Обязан совпадать с clean.near_dup.threshold. Более строгий порог здесь
  # ловил бы не контаминацию, а разницу порогов: пары с Жаккаром между
  # порогом чистки и порогом проверки очистку проходят законно.
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
