# Optional workflow template. Local CI has been executed; this file is not evidence of GitHub runs.
name: Fast release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw8910
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
      - run: uv sync --frozen
      - run: make check PYTHON='.venv/bin/python'
